<div class="wrap page">
  <!-- caminho de navegação: Início / Alterar senha -->
  <nav class="crumbs" aria-label="Você está aqui"><a routerLink="/">Início</a> / <span>Alterar senha</span></nav>
  <h1>Alterar senha</h1>
  <p class="lead">Escolha uma senha nova para a sua conta.</p>

  <!-- (ngSubmit) chama salvar() ao clicar no botão; novalidate deixa o Angular fazer a validação -->
  <form class="card form" [formGroup]="form" (ngSubmit)="salvar()" novalidate>
    <!-- senha atual: confirma que quem está trocando é a dona da conta -->
    <label class="field" [class.invalid]="invalido('atual')">
      Senha atual
      <!-- o type muda entre 'text' e 'password' conforme o "Mostrar senhas" -->
      <input formControlName="atual" [type]="verSenha() ? 'text' : 'password'" autocomplete="current-password" />
      @if (invalido('atual')) { <span class="err">Informe sua senha atual.</span> }
    </label>

    <!-- nova senha: mínimo de 4 caracteres e diferente da atual -->
    <label class="field" [class.invalid]="invalido('nova') || (form.errors?.['igual'] && form.controls.nova.dirty)">
      Nova senha
      <input formControlName="nova" [type]="verSenha() ? 'text' : 'password'" autocomplete="new-password" />
      <span class="hint">Mínimo de 4 caracteres.</span>
      @if (invalido('nova')) {
        <span class="err">A nova senha precisa ter pelo menos 4 caracteres.</span>
      } @else if (form.errors?.['igual'] && form.controls.nova.dirty) {
        <span class="err">A nova senha não pode ser igual à atual.</span>
      }
    </label>

    <!-- confirmar: repete a nova senha para evitar erro de digitação -->
    <label class="field" [class.invalid]="invalido('confirmar') || (form.errors?.['diferentes'] && form.controls.confirmar.dirty)">
      Confirmar nova senha
      <input formControlName="confirmar" [type]="verSenha() ? 'text' : 'password'" autocomplete="new-password" />
      @if (form.errors?.['diferentes'] && (form.controls.confirmar.dirty || tentou())) {
        <span class="err">As senhas não conferem.</span>
      }
    </label>

    <!-- mostra ou esconde as 3 senhas de uma vez -->
    <label class="ver">
      <input type="checkbox" [checked]="verSenha()" (change)="verSenha.set(!verSenha())" />
      Mostrar senhas
    </label>

    <!-- mensagem de erro (vermelha) e de sucesso (verde) -->
    @if (erro()) { <p class="msg erro" role="alert">{{ erro() }}</p> }
    @if (sucesso()) { <p class="msg ok" role="status">Senha alterada com sucesso!</p> }

    <div class="acoes">
      <!-- fica desativado enquanto está salvando, para não clicar duas vezes -->
      <button class="btn" type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Salvando…' : 'Salvar nova senha' }}
      </button>
      <a class="link" routerLink="/meus-pedidos">Voltar</a>
    </div>
  </form>
</div>
